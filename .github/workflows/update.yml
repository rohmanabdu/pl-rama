name: Update pl-ramaa

on:
  workflow_dispatch:
  schedule:
    - cron: '0 1 * * *'

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install requests
      - run: python merge.py
      - run: |
          ls -lh
          git config user.name "bot"
          git config user.email "bot@github.com"
          git add -A
          git add *.m3u
          git add playlists/*.m3u || true
          git status
          git commit -m "update pl-ramaaz.m3u" || echo "no changes"
          git push
